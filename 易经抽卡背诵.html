<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>64卦 爻辞记忆抽卡</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #d4af37; /* 现代感暗金色 */
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Serif SC", serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .gua-name {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .yao-name {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent);
            margin: 0;
            letter-spacing: 2px;
        }

        .content {
            display: none;
            text-align: left;
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .content.visible {
            display: block;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .section-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
            margin: 0;
        }

        .yao-highlight {
            background: rgba(212, 175, 55, 0.1);
            padding: 15px;
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--border);
        }

        button.primary {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="gua-name" id="guaName">准备中...</div>
            <h1 class="yao-name" id="yaoName">-</h1>
        </div>

        <div class="content" id="detailContent">
            <div class="section">
                <div class="section-title">卦辞</div>
                <p class="section-text" id="guaCi"></p>
            </div>
            <div class="section">
                <div class="section-title">彖曰</div>
                <p class="section-text" id="tuan"></p>
            </div>
            <div class="section">
                <div class="section-title">大象</div>
                <p class="section-text" id="daXiang"></p>
            </div>
            
            <div class="section yao-highlight">
                <div class="section">
                    <div class="section-title">爻辞</div>
                    <p class="section-text" id="yaoCi" style="font-weight: bold;"></p>
                </div>
                <div class="section" style="margin-bottom: 0;">
                    <div class="section-title">小象</div>
                    <p class="section-text" id="xiaoXiang"></p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="revealBtn" class="primary">揭晓答案</button>
            <button id="nextBtn" style="display: none;">下一爻</button>
        </div>
    </div>

            { "name": "初六", "yaoci": "拔茅茹，以其汇，贞吉亨。", "xiaoxiang": "拔茅贞吉，志在君也。" },
            { "name": "六二", "yaoci": "包承。小人吉，大人否亨。", "xiaoxiang": "大人否亨，不乱群也。" },
            { "name": "六三", "yaoci": "包羞。", "xiaoxiang": "包羞，位不当也。" },
            { "name": "九四", "yaoci": "有命无咎，畴离祉。", "xiaoxiang": "有命无咎，志行也。" },
            { "name": "九五", "yaoci": "休否，大人吉。其亡其亡，系于苞桑。", "xiaoxiang": "大人之吉，位正当也。" },
            { "name": "上九", "yaoci": "倾否，先否后喜。", "xiaoxiang": "否终则倾，何可长也。" }
        ]
    },
    {
        "gua": "同人卦",
        "guaci": "同人于野，亨。利涉大川，利君子贞。",
        "tuan": "同人，柔得位得中，而应乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。",
        "daxiang": "天与火，同人；君子以类族辨物。",
        "yaos": [
            { "name": "初九", "yaoci": "同人于门，无咎。", "xiaoxiang": "出门同人，又谁咎也。" },
            { "name": "六二", "yaoci": "同人于宗，吝。", "xiaoxiang": "同人于宗，吝道也。" },
            { "name": "九三", "yaoci": "伏戎于莽，升其高陵，三岁不兴。", "xiaoxiang": "伏戎于莽，敌刚也。三岁不兴，安行也。" },
            { "name": "九四", "yaoci": "乘其墉，弗克攻，吉。", "xiaoxiang": "乘其墉，义弗克也，其吉，则困而反则也。" },
            { "name": "九五", "yaoci": "同人，先号咷而后笑。大师克相遇。", "xiaoxiang": "同人之先，以中直也。大师相遇，言相克也。" },
            { "name": "上九", "yaoci": "同人于郊，无悔。", "xiaoxiang": "同人于郊，志未得也。" }
        ]
    },
    {
        "gua": "大有卦",
        "guaci": "元亨。",
        "tuan": "大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。",
        "daxiang": "火在天上，大有；君子以遏恶扬善，顺天休命。",
        "yaos": [
            { "name": "初九", "yaoci": "无交害，匪咎，艰则无咎。", "xiaoxiang": "大有初九，无交害也。" },
            { "name": "九二", "yaoci": "大车以载，有攸往，无咎。", "xiaoxiang": "大车以载，积中不败也。" },
            { "name": "九三", "yaoci": "公用亨于天子，小人弗克。", "xiaoxiang": "公用亨于天子，小人害也。" },
            { "name": "九四", "yaoci": "匪其彭，无咎。", "xiaoxiang": "匪其彭，无咎；明辨晰也。" },
            { "name": "六五", "yaoci": "厥孚交如，威如；吉。", "xiaoxiang": "厥孚交如，信以发志也。威如之吉，易而无备也。" },
            { "name": "上九", "yaoci": "自天佑之，吉无不利。", "xiaoxiang": "大有上吉，自天佑也。" }
        ]
    },
    {
        "gua": "谦卦",
        "guaci": "亨，君子有终。",
        "tuan": "谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。",
        "daxiang": "地中有山，谦；君子以裒多益寡，称物平施。",
        "yaos": [
            { "name": "初六", "yaoci": "谦谦君子，用涉大川，吉。", "xiaoxiang": "谦谦君子，卑以自牧也。" },
            { "name": "六二", "yaoci": "鸣谦，贞吉。", "xiaoxiang": "鸣谦贞吉，中心得也。" },
            { "name": "九三", "yaoci": "劳谦，君子有终，吉。", "xiaoxiang": "劳谦君子，万民服也。" },
            { "name": "六四", "yaoci": "无不利，撝谦。", "xiaoxiang": "无不利，撝谦；不违则也。" },
            { "name": "六五", "yaoci": "不富以其邻，利用侵伐，无不利。", "xiaoxiang": "利用侵伐，征不服也。" },
            { "name": "上六", "yaoci": "鸣谦，利用行师，征邑国。", "xiaoxiang": "鸣谦，志未得也。可用行师，征邑国也。" }
        ]
    },
    {
        "gua": "豫卦",
        "guaci": "利建侯行师。",
        "tuan": "豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！",
        "daxiang": "雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。",
        "yaos": [
            { "name": "初六", "yaoci": "鸣豫，凶。", "xiaoxiang": "初六鸣豫，志穷凶也。" },
            { "name": "六二", "yaoci": "介于石，不终日，贞吉。", "xiaoxiang": "不终日，贞吉；以中正也。" },
            { "name": "六三", "yaoci": "盱豫，悔。迟有悔。", "xiaoxiang": "盱豫有悔，位不当也。" },
            { "name": "九四", "yaoci": "由豫，大有得。勿疑。朋盍簪。", "xiaoxiang": "由豫，大有得；志大行也。" },
            { "name": "六五", "yaoci": "贞疾，恒不死。", "xiaoxiang": "六五贞疾，乘刚也。恒不死，中未亡也。" },
            { "name": "上六", "yaoci": "冥豫，成有渝，无咎。", "xiaoxiang": "冥豫在上，何可长也。" }
        ]
    },
    {
        "gua": "随卦",
        "guaci": "元亨利贞，无咎。",
        "tuan": "随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随之时义大矣哉！",
        "daxiang": "泽中有雷，随；君子以向晦入宴息。",
        "yaos": [
            { "name": "初九", "yaoci": "官有渝，贞吉。出门交有功。", "xiaoxiang": "官有渝，从正吉也。出门交有功，不失也。" },
            { "name": "六二", "yaoci": "系小子，失丈夫。", "xiaoxiang": "系小子，弗兼与也。" },
            { "name": "六三", "yaoci": "系丈夫，失小子。随有求得，利居贞。", "xiaoxiang": "系丈夫，志舍下也。" },
            { "name": "九四", "yaoci": "随有获，贞凶。有孚在道，以明，何咎。", "xiaoxiang": "随有获，其义凶也。有孚在道，明功也。" },
            { "name": "九五", "yaoci": "孚于嘉，吉。", "xiaoxiang": "孚于嘉，吉；位正中也。" },
            { "name": "上六", "yaoci": "拘系之，乃从维之。王用亨于西山。", "xiaoxiang": "拘系之，上穷也。" }
        ]
    },
    {
        "gua": "蛊卦",
        "guaci": "元亨，利涉大川。先甲三日，后甲三日。",
        "tuan": "蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。",
        "daxiang": "山下有风，蛊；君子以振民育德。",
        "yaos": [
            { "name": "初六", "yaoci": "干父之蛊，有子，考无咎，厉终吉。", "xiaoxiang": "干父之蛊，意承考也。" },
            { "name": "九二", "yaoci": "干母之蛊，不可贞。", "xiaoxiang": "干母之蛊，得中道也。" },
            { "name": "九三", "yaoci": "干父之蛊，小有悔，无大咎。", "xiaoxiang": "干父之蛊，终无咎也。" },
            { "name": "六四", "yaoci": "裕父之蛊，往见吝。", "xiaoxiang": "裕父之蛊，往未当也。" },
            { "name": "六五", "yaoci": "干父之蛊，用誉。", "xiaoxiang": "干父用誉，承以德也。" },
            { "name": "上九", "yaoci": "不事王侯，高尚其事。", "xiaoxiang": "不事王侯，志可则也。" }
        ]
    },
    {
        "gua": "临卦",
        "guaci": "元，亨，利，贞。至于八月有凶。",
        "tuan": "临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。",
        "daxiang": "泽上有地，临；君子以教思无穷，容保民无疆。",
        "yaos": [
            { "name": "初九", "yaoci": "咸临，贞吉。", "xiaoxiang": "咸临贞吉，志行正也。" },
            { "name": "九二", "yaoci": "咸临，吉无不利。", "xiaoxiang": "咸临，吉无不利；未顺命也。" },
            { "name": "六三", "yaoci": "甘临，无攸利。既忧之，无咎。", "xiaoxiang": "甘临，位不当也。既忧之，咎不长也。" },
            { "name": "六四", "yaoci": "至临，无咎。", "xiaoxiang": "至临无咎，位当也。" },
            { "name": "六五", "yaoci": "知临，大君之宜，吉。", "xiaoxiang": "大君之宜，行中之谓也。" },
            { "name": "上六", "yaoci": "敦临，吉无咎。", "xiaoxiang": "敦临之吉，志在内也。" }
        ]
    },
    {
        "gua": "观卦",
        "guaci": "盥而不荐，有孚颙若。",
        "tuan": "大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。",
        "daxiang": "风行地上，观；先王以省方，观民设教。",
        "yaos": [
            { "name": "初六", "yaoci": "童观，小人无咎，君子吝。", "xiaoxiang": "初六童观，小人道也。" },
            { "name": "六二", "yaoci": "窥观，利女贞。", "xiaoxiang": "窥观女贞，亦可丑也。" },
            { "name": "六三", "yaoci": "观我生，进退。", "xiaoxiang": "观我生，进退；未失道也。" },
            { "name": "六四", "yaoci": "观国之光，利用宾于王。", "xiaoxiang": "观国之光，尚宾也。" },
            { "name": "九五", "yaoci": "观我生，君子无咎。", "xiaoxiang": "观我生，观民也。" },
            { "name": "上九", "yaoci": "观其生，君子无咎。", "xiaoxiang": "观其生，志未平也。" }
        ]
    },
    {
        "gua": "噬嗑卦",
        "guaci": "亨。利用狱。",
        "tuan": "颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。",
        "daxiang": "雷电合而章，噬嗑；先王以明罚敕法。",
        "yaos": [
            { "name": "初九", "yaoci": "屦校灭趾，无咎。", "xiaoxiang": "屦校灭趾，不行也。" },
            { "name": "六二", "yaoci": "噬肤灭鼻，无咎。", "xiaoxiang": "噬肤灭鼻，乘刚也。" },
            { "name": "六三", "yaoci": "噬腊肉，遇毒；小吝，无咎。", "xiaoxiang": "遇毒，位不当也。" },
            { "name": "九四", "yaoci": "噬干胏，得金矢，利艰贞，吉。", "xiaoxiang": "利艰贞吉，未光也。" },
            { "name": "六五", "yaoci": "噬干肉，得黄金，贞厉，无咎。", "xiaoxiang": "贞厉无咎，得当也。" },
            { "name": "上九", "yaoci": "何校灭耳，凶。", "xiaoxiang": "何校灭耳，聪不明也。" }
        ]
    },
    {
        "gua": "贲卦",
        "guaci": "亨。小利有攸往。",
        "tuan": "贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。",
        "daxiang": "山下有火，贲；君子以明庶政，无敢折狱。",
        "yaos": [
            { "name": "初九", "yaoci": "贲其趾，舍车而徒。", "xiaoxiang": "舍车而徒，义弗乘也。" },
            { "name": "六二", "yaoci": "贲其须。", "xiaoxiang": "贲其须，与上兴也。" },
            { "name": "九三", "yaoci": "贲如濡如，永贞吉。", "xiaoxiang": "永贞之吉，终莫之陵也。" },
            { "name": "六四", "yaoci": "贲如皤如，白马翰如，匪寇婚媾。", "xiaoxiang": "六四，当位疑也。匪寇婚媾，终无尤也。" },
            { "name": "六五", "yaoci": "贲于丘园，束帛戋戋，吝，终吉。", "xiaoxiang": "六五之吉，有喜也。" },
            { "name": "上九", "yaoci": "白贲，无咎。", "xiaoxiang": "白贲无咎，上得志也。" }
        ]
    },
    {
        "gua": "剥卦",
        "guaci": "不利有攸往。",
        "tuan": "剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。",
        "daxiang": "山附于地，剥；上以厚下，安宅。",
        "yaos": [

            { "name": "六二", "yaoci": "剥床以辨，蔑贞凶。", "xiaoxiang": "剥床以辨，未有与也。" },
            { "name": "六三", "yaoci": "剥之，无咎。", "xiaoxiang": "剥之无咎，失上下也。" },
            { "name": "六四", "yaoci": "剥床以肤，凶。", "xiaoxiang": "剥床以肤，切近灾也。" },
            { "name": "六五", "yaoci": "贯鱼，以宫人宠，无不利。", "xiaoxiang": "以宫人宠，终无尤也。" },
            { "name": "上九", "yaoci": "硕果不食，君子得舆，小人剥庐。", "xiaoxiang": "君子得舆，民所载也。小人剥庐，终不可用也。" }
        ]
    },
    {
        "gua": "复卦",
        "guaci": "亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。",
        "tuan": "复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？",
        "daxiang": "雷在地中，复；先王以至日闭关，商旅不行，后不省方。",
        "yaos": [
            { "name": "初九", "yaoci": "不远复，无祗悔，元吉。", "xiaoxiang": "不远之复，以修身也。" },
            { "name": "六二", "yaoci": "休复，吉。", "xiaoxiang": "休复之吉，以下仁也。" },
            { "name": "六三", "yaoci": "频复，厉无咎。", "xiaoxiang": "频复之厉，义无咎也。" },
            { "name": "六四", "yaoci": "中行独复。", "xiaoxiang": "中行独复，以从道也。" },
            { "name": "六五", "yaoci": "敦复，无悔。", "xiaoxiang": "敦复无悔，中以自考也。" },
            { "name": "上六", "yaoci": "迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。", "xiaoxiang": "迷复之凶，反君道也。" }
        ]
    },
    {
        "gua": "无妄卦",
        "guaci": "元，亨，利，贞。其匪正有眚，不利有攸往。",
        "tuan": "无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？天命不佑，行矣哉？",
        "daxiang": "天下雷行，物与无妄；先王以茂对时，育万物。",
        "yaos": [
            { "name": "初九", "yaoci": "无妄，往吉。", "xiaoxiang": "无妄之往，得志也。" },
            { "name": "六二", "yaoci": "不耕获，不菑畲，则利有攸往。", "xiaoxiang": "不耕获，未富也。" },

            { "name": "九四", "yaoci": "可贞，无咎。", "xiaoxiang": "可贞无咎，固有之也。" },
            { "name": "九五", "yaoci": "无妄之疾，勿药有喜。", "xiaoxiang": "无妄之药，不可试也。" },
            { "name": "上九", "yaoci": "无妄，行有眚，无攸利。", "xiaoxiang": "无妄之行，穷之灾也。" }
        ]
    },
    {
        "gua": "大畜卦",
        "guaci": "利贞，不家食吉，利涉大川。",
        "tuan": "大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。",
        "daxiang": "天在山中，大畜；君子以多识前言往行，以畜其德。",
        "yaos": [
            { "name": "初九", "yaoci": "有厉利已。", "xiaoxiang": "有厉利已，不犯灾也。" },
            { "name": "九二", "yaoci": "舆说輹。", "xiaoxiang": "舆说輹，中无尤也。" },
            { "name": "九三", "yaoci": "良马逐，利艰贞。曰闲舆卫，利有攸往。", "xiaoxiang": "利有攸往，上合志也。" },
            { "name": "六四", "yaoci": "童牛之牿，元吉。", "xiaoxiang": "六四元吉，有喜也。" },
            { "name": "六五", "yaoci": "豮豕之牙，吉。", "xiaoxiang": "六五之吉，有庆也。" },
            { "name": "上九", "yaoci": "何天之衢，亨。", "xiaoxiang": "何天之衢，道大行也。" }
        ]
    },
    {
        "gua": "颐卦",
        "guaci": "贞吉。观颐，自求口实。",
        "tuan": "颐贞吉，养正则吉也。观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤，以及万民；颐之时大矣哉！",
        "daxiang": "山下有雷，颐；君子以慎言语，节饮食。",
        "yaos": [

            { "name": "六二", "yaoci": "颠颐，拂经，于丘颐，征凶。", "xiaoxiang": "六二征凶，行失类也。" },

            { "name": "六四", "yaoci": "颠颐，吉，虎视眈眈，其欲逐逐，无咎。", "xiaoxiang": "颠颐之吉，上施光也。" },

    {

            { "name": "初六", "yaoci": "藉用白茅，无咎。", "xiaoxiang": "藉用白茅，柔在下也。" },

            { "name": "九三", "yaoci": "小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。", "xiaoxiang": "小人用壮，君子罔也。" },

            { "name": "六二", "yaoci": "或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。", "xiaoxiang": "或益之，自外来也。" },
            { "name": "六三", "yaoci": "益之用凶事，无咎。有孚中行，告公用圭。", "xiaoxiang": "益用凶事，固有之也。" },
            { "name": "六四", "yaoci": "中行，告公从。利用为依迁国。", "xiaoxiang": "告公从，以益志也。" },
            { "name": "九五", "yaoci": "有孚惠心，勿问元吉。有孚惠我德。", "xiaoxiang": "有孚惠心，勿问之矣。惠我德，大得志也。" },
            { "name": "上九", "yaoci": "莫益之，或击之，立心勿恒，凶。", "xiaoxiang": "莫益之，偏辞也。或击之，自外来也。" }
        ]
    },
    {
        "gua": "夬卦",
        "guaci": "扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。",
        "tuan": "夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。",
        "daxiang": "泽上于天，夬；君子以施禄及下，居德则忌。",
        "yaos": [
            { "name": "初九", "yaoci": "壮于前趾，往不胜为咎。", "xiaoxiang": "不胜而往，咎也。" },
            { "name": "九二", "yaoci": "惕号，莫夜有戎，勿恤。", "xiaoxiang": "莫夜有戎，得中道也。" },
            { "name": "九三", "yaoci": "壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。", "xiaoxiang": "君子夬夬，终无咎也。" },
            { "name": "九四", "yaoci": "臀无肤，其行次且。牵羊悔亡，闻言不信。", "xiaoxiang": "其行次且，位不当也。闻言不信，聪不明也。" },
            { "name": "九五", "yaoci": "苋陆夬夬，中行无咎。", "xiaoxiang": "中行无咎，中未光也。" },
            { "name": "上六", "yaoci": "无号，终有凶。", "xiaoxiang": "无号之凶，终不可长也。" }
        ]
    },
    {
        "gua": "姤卦",
        "guaci": "女壮，勿用取女。",
        "tuan": "姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！",
        "daxiang": "天下有风，姤；后以施命诰四方。",
        "yaos": [
            { "name": "初六", "yaoci": "系于金柅，贞吉，有攸往，见凶，羸豕孚蹢躅。", "xiaoxiang": "系于金柅，柔道牵也。" },
            { "name": "九二", "yaoci": "包有鱼，无咎，不利宾。", "xiaoxiang": "包有鱼，义不及宾也。" },
            { "name": "九三", "yaoci": "臀无肤，其行次且，厉，无大咎。", "xiaoxiang": "其行次且，行未牵也。" },
            { "name": "九四", "yaoci": "包无鱼，起凶。", "xiaoxiang": "无鱼之凶，远民也。" },
            { "name": "九五", "yaoci": "以杞包瓜，含章，有陨自天。", "xiaoxiang": "九五含章，中正也。有陨自天，志不舍命也。" },
            { "name": "上九", "yaoci": "姤其角，吝，无咎。", "xiaoxiang": "姤其角，上穷吝也。" }
        ]
    },
    {
        "gua": "萃卦",
        "guaci": "亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。",
        "tuan": "萃，聚也；顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。",
        "daxiang": "泽上于地，萃；君子以除戎器，戒不虞。",
        "yaos": [
            { "name": "初六", "yaoci": "有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。", "xiaoxiang": "乃乱乃萃，其志乱也。" },
            { "name": "六二", "yaoci": "引吉，无咎，孚乃利用禴。", "xiaoxiang": "引吉无咎，中未变也。" },
            { "name": "六三", "yaoci": "萃如，嗟如，无攸利，往无咎，小吝。", "xiaoxiang": "往无咎，上巽也。" },
            { "name": "九四", "yaoci": "大吉，无咎。", "xiaoxiang": "大吉无咎，位不当也。" },
            { "name": "九五", "yaoci": "萃有位，无咎。匪孚，元永贞，悔亡。", "xiaoxiang": "萃有位，志未光也。" },
            { "name": "上六", "yaoci": "赍咨涕洟，无咎。", "xiaoxiang": "赍咨涕洟，未安上也。" }
        ]
    },
    {
        "gua": "升卦",
        "guaci": "元亨，用见大人，勿恤，南征吉。",
        "tuan": "柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。",
        "daxiang": "地中生木，升；君子以顺德，积小以高大。",
        "yaos": [
            { "name": "初六", "yaoci": "允升，大吉。", "xiaoxiang": "允升大吉，上合志也。" },
            { "name": "九二", "yaoci": "孚乃利用禴，无咎。", "xiaoxiang": "九二之孚，有喜也。" },
            { "name": "九三", "yaoci": "升虚邑。", "xiaoxiang": "升虚邑，无所疑也。" },
            { "name": "六四", "yaoci": "王用亨于岐山，吉无咎。", "xiaoxiang": "王用亨于岐山，顺事也。" },
            { "name": "六五", "yaoci": "贞吉，升阶。", "xiaoxiang": "贞吉升阶，大得志也。" },
            { "name": "上六", "yaoci": "冥升，利于不息之贞。", "xiaoxiang": "冥升在上，消不富也。" }
        ]
    },
    {
        "gua": "困卦",
        "guaci": "亨，贞，大人吉，无咎，有言不信。",
        "tuan": "困，刚掩也。险以说，困而不失其所，亨；其唯君子乎？贞大人吉，以刚中也。有言不信，尚口乃穷也。",
        "daxiang": "泽无水，困；君子以致命遂志。",
        "yaos": [
            { "name": "初六", "yaoci": "臀困于株木，入于幽谷，三岁不见。", "xiaoxiang": "入于幽谷，幽不明也。" },
            { "name": "九二", "yaoci": "困于酒食，朱绂方来，利用亨祀，征凶，无咎。", "xiaoxiang": "困于酒食，中有庆也。" },
            { "name": "六三", "yaoci": "困于石，据于蒺藜，入于其宫，不见其妻，凶。", "xiaoxiang": "据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。" },
            { "name": "九四", "yaoci": "来徐徐，困于金车，吝，有终。", "xiaoxiang": "来徐徐，志在下也。虽不当位，有与也。" },
            { "name": "九五", "yaoci": "劓刖，困于赤绂，乃徐有说，利用祭祀。", "xiaoxiang": "劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。" },
            { "name": "上六", "yaoci": "困于葛藟，于臲卼，曰动悔。有悔，征吉。", "xiaoxiang": "困于葛藟，未当也。动悔，有悔吉，行也。" }
        ]
    },
    {
        "gua": "井卦",
        "guaci": "改邑不改井，无丧无得，往来井井。汔至，亦未繘井，羸其瓶，凶。",
        "tuan": "巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。",
        "daxiang": "木上有水，井；君子以劳民劝相。",
        "yaos": [
            { "name": "初六", "yaoci": "井泥不食，旧井无禽。", "xiaoxiang": "井泥不食，下也。旧井无禽，时舍也。" },
            { "name": "九二", "yaoci": "井谷射鲋，瓮敝漏。", "xiaoxiang": "井谷射鲋，无与也。" },
            { "name": "九三", "yaoci": "井渫不食，为我心恻，可用汲，王明，并受其福。", "xiaoxiang": "井渫不食，行恻也。求王明，受福也。" },
            { "name": "六四", "yaoci": "井甃，无咎。", "xiaoxiang": "井甃无咎，修井也。" },
            { "name": "九五", "yaoci": "井冽，寒泉食。", "xiaoxiang": "寒泉之食，中正也。" },
            { "name": "上六", "yaoci": "井收勿幕，有孚元吉。", "xiaoxiang": "元吉在上，大成也。" }
        ]
    },
    {
        "gua": "革卦",
        "guaci": "己日乃孚，元亨利贞，悔亡。",
        "tuan": "革，水火相息，二女同居，其志不相得，曰革。己日乃孚；革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时大矣哉！",
        "daxiang": "泽中有火，革；君子以治历明时。",
        "yaos": [
            { "name": "初九", "yaoci": "巩用黄牛之革。", "xiaoxiang": "巩用黄牛，不可以有为也。" },
            { "name": "六二", "yaoci": "己日乃革之，征吉，无咎。", "xiaoxiang": "己日革之，行有嘉也。" },
            { "name": "九三", "yaoci": "征凶，贞厉。革言三就，有孚。", "xiaoxiang": "革言三就，又何之矣。" },
            { "name": "九四", "yaoci": "悔亡，有孚改命，吉。", "xiaoxiang": "改命之吉，信志也。" },
            { "name": "九五", "yaoci": "大人虎变，未占有孚。", "xiaoxiang": "大人虎变，其文炳也。" },
            { "name": "上六", "yaoci": "君子豹变，小人革面，征凶，居贞吉。", "xiaoxiang": "君子豹变，其文蔚也。小人革面，顺以从君也。" }
        ]
    },
    {
        "gua": "鼎卦",
        "guaci": "元吉，亨。",
        "tuan": "鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。",
        "daxiang": "木上有火，鼎；君子以正位凝命。",
        "yaos": [
            { "name": "初六", "yaoci": "鼎颠趾，利出否，得妾以其子，无咎。", "xiaoxiang": "鼎颠趾，未悖也。利出否，以从贵也。" },
            { "name": "九二", "yaoci": "鼎有实，我仇有疾，不我能即，吉。", "xiaoxiang": "鼎有实，慎所之也。我仇有疾，终无尤也。" },
            { "name": "九三", "yaoci": "鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。", "xiaoxiang": "鼎耳革，失其义也。" },
            { "name": "九四", "yaoci": "鼎折足，覆公餗，其形渥，凶。", "xiaoxiang": "覆公餗，信如何也。" },
            { "name": "六五", "yaoci": "鼎黄耳金铉，利贞。", "xiaoxiang": "鼎黄耳，中以为实也。" },
            { "name": "上九", "yaoci": "鼎玉铉，大吉，无不利。", "xiaoxiang": "玉铉在上，刚柔节也。" }
        ]
    },
    {
        "gua": "震卦",
        "guaci": "亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。",
        "tuan": "震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。",
        "daxiang": "洊雷，震；君子以恐惧修省。",
        "yaos": [
            { "name": "初九", "yaoci": "震来虩虩，后笑言哑哑，吉。", "xiaoxiang": "震来虩虩，恐致福也。笑言哑哑，后有则也。" },
            { "name": "六二", "yaoci": "震来厉，亿丧贝，跻于九陵，勿逐，七日得。", "xiaoxiang": "震来厉，乘刚也。" },
            { "name": "六三", "yaoci": "震苏苏，震行无眚。", "xiaoxiang": "震苏苏，位不当也。" },
            { "name": "九四", "yaoci": "震遂泥。", "xiaoxiang": "震遂泥，未光也。" },
            { "name": "六五", "yaoci": "震往来厉，亿无丧，有事。", "xiaoxiang": "震往来厉，危行也。其事在中，大无丧也。" },
            { "name": "上六", "yaoci": "震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。", "xiaoxiang": "震索索，中未得也。虽凶无咎，畏邻戒也。" }
        ]
    },
    {
        "gua": "艮卦",
        "guaci": "艮其背，不获其身，行其庭，不见其人，无咎。",
        "tuan": "艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。",
        "daxiang": "兼山，艮；君子以思不出其位。",
        "yaos": [
            { "name": "初六", "yaoci": "艮其趾，无咎，利永贞。", "xiaoxiang": "艮其趾，未失正也。" },
            { "name": "六二", "yaoci": "艮其腓，不拯其随，其心不快。", "xiaoxiang": "不拯其随，未退听也。" },
            { "name": "九三", "yaoci": "艮其限，列其夤，厉熏心。", "xiaoxiang": "艮其限，危熏心也。" },
            { "name": "六四", "yaoci": "艮其身，无咎。", "xiaoxiang": "艮其身，止诸躬也。" },
            { "name": "六五", "yaoci": "艮其辅，言有序，悔亡。", "xiaoxiang": "艮其辅，以中正也。" },
            { "name": "上九", "yaoci": "敦艮，吉。", "xiaoxiang": "敦艮之吉，以厚终也。" }
        ]
    },
    {
        "gua": "渐卦",
        "guaci": "女归吉，利贞。",
        "tuan": "渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。",
        "daxiang": "山上有木，渐；君子以居贤德，善俗。",
        "yaos": [
            { "name": "初六", "yaoci": "鸿渐于干，小子厉，有言，无咎。", "xiaoxiang": "小子之厉，义无咎也。" },
            { "name": "六二", "yaoci": "鸿渐于磐，饮食衎衎，吉。", "xiaoxiang": "饮食衎衎，不素饱也。" },
            { "name": "九三", "yaoci": "鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。", "xiaoxiang": "夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。" },
            { "name": "六四", "yaoci": "鸿渐于木，或得其桷，无咎。", "xiaoxiang": "或得其桷，顺以巽也。" },
            { "name": "九五", "yaoci": "鸿渐于陵，妇三岁不孕，终莫之胜，吉。", "xiaoxiang": "终莫之胜，吉；得所愿也。" },
            { "name": "上九", "yaoci": "鸿渐于陆，其羽可用为仪，吉。", "xiaoxiang": "其羽可用为仪，吉；不可乱也。" }
        ]
    },
    {
        "gua": "归妹卦",
        "guaci": "征凶，无攸利。",
        "tuan": "归妹，天地之大义也。天地不交，而万物不兴，归妹人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。",
        "daxiang": "泽上有雷，归妹；君子以永终知敝。",
        "yaos": [
            { "name": "初九", "yaoci": "归妹以娣，跛能履，征吉。", "xiaoxiang": "归妹以娣，以恒也。跛能履吉，相承也。" },
            { "name": "九二", "yaoci": "眇能视，利幽人之贞。", "xiaoxiang": "利幽人之贞，未变常也。" },
            { "name": "六三", "yaoci": "归妹以须，反归以娣。", "xiaoxiang": "归妹以须，未当也。" },
            { "name": "九四", "yaoci": "归妹愆期，迟归有时。", "xiaoxiang": "愆期之迟，有待而行也。" },
            { "name": "六五", "yaoci": "帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。", "xiaoxiang": "帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。" },
            { "name": "上六", "yaoci": "女承筐无实，士刲羊无血，无攸利。", "xiaoxiang": "上六无实，承虚筐也。" }
        ]
    },
    {
        "gua": "丰卦",
        "guaci": "亨，王假之，勿忧，宜日中。",
        "tuan": "丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？",
        "daxiang": "雷电皆至，丰；君子以折狱致刑。",
        "yaos": [
            { "name": "初九", "yaoci": "遇其配主，虽旬无咎，往有尚。", "xiaoxiang": "虽旬无咎，过旬灾也。" },
            { "name": "六二", "yaoci": "丰其蔀，日中见斗，往得疑疾，有孚发若，吉。", "xiaoxiang": "有孚发若，信以发志也。" },
            { "name": "九三", "yaoci": "丰其沛，日中见沫，折其右肱，无咎。", "xiaoxiang": "丰其沛，不可大事也。折其右肱，终不可用也。" },
            { "name": "九四", "yaoci": "丰其蔀，日中见斗，遇其夷主，吉。", "xiaoxiang": "丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。" },
            { "name": "六五", "yaoci": "来章，有庆誉，吉。", "xiaoxiang": "六五之吉，有庆也。" },
            { "name": "上六", "yaoci": "丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。", "xiaoxiang": "丰其屋，天际翔也。窥其户，阒其无人，自藏也。" }
        ]
    },
    {
        "gua": "旅卦",
        "guaci": "小亨，旅贞吉。",
        "tuan": "旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！",
        "daxiang": "山上有火，旅；君子以明慎用刑，而不留狱。",
        "yaos": [
            { "name": "初六", "yaoci": "旅琐琐，斯其所取灾。", "xiaoxiang": "旅琐琐，志穷灾也。" },

        let currentGua = null;
        let currentYao = null;

        const elements = {
            guaName: document.getElementById('guaName'),
            yaoName: document.getElementById('yaoName'),
            content: document.getElementById('detailContent'),
            guaCi: document.getElementById('guaCi'),
            tuan: document.getElementById('tuan'),
            daXiang: document.getElementById('daXiang'),

            xiaoXiang: document.getElementById('xiaoXiang'),
            revealBtn: document.getElementById('revealBtn'),
            nextBtn: document.getElementById('nextBtn')
        };

        function pickRandom() {
            // 随机抽取一卦
            const randomGuaIndex = Math.floor(Math.random() * ichingData.length);
            currentGua = ichingData[randomGuaIndex];
            
            // 随机抽取该卦中的一爻
            const randomYaoIndex = Math.floor(Math.random() * currentGua.yaos.length);
            currentYao = currentGua.yaos[randomYaoIndex];

            renderQuestion();
        }

        function renderQuestion() {
            // 重置UI状态
            elements.content.classList.remove('visible');
            elements.revealBtn.style.display = 'block';
            elements.nextBtn.style.display = 'none';

            // 渲染题目
            elements.guaName.textContent = currentGua.gua;
            elements.yaoName.textContent = currentYao.name;
        }

        function revealAnswer() {
            // 填充答案文本
            elements.guaCi.textContent = currentGua.guaci;
            elements.tuan.textContent = currentGua.tuan;
            elements.daXiang.textContent = currentGua.daxiang;
            elements.yaoCi.textContent = currentYao.yaoci;
            elements.xiaoXiang.textContent = currentYao.xiaoxiang;

            // 显示内容区，切换按钮
            elements.content.classList.add('visible');
            elements.revealBtn.style.display = 'none';
            elements.nextBtn.style.display = 'block';
        }

        // 绑定事件
        elements.revealBtn.addEventListener('click', revealAnswer);
        elements.nextBtn.addEventListener('click', pickRandom);

        // 初始化
        pickRandom();
